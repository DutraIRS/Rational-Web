name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,docs,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: for f in src/rational/static/*.js; do node --check "$f"; done
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - name: The built version is the tag
        run: test -f "dist/rational-${GITHUB_REF_NAME#v}.tar.gz"
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing: no API token stored in the repository
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
