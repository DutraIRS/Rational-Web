name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Browser tests ran in CI on this same commit (pushed with the tag); installing a browser here
      # needs Ubuntu's package mirror, which can stall a release for many minutes.
      - run: python -m pip install -e ".[dev,docs]"
      - run: for f in src/rational/static/*.js; do node --check "$f"; done
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest --ignore=tests/browser --cov
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - name: The built version is the tag
        run: test -f "dist/rational-${GITHUB_REF_NAME#v}.tar.gz"
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing: no API token stored in the repository
    steps:
      # This job can publish to PyPI: its actions are pinned to commits, which nobody can move (Dependabot updates them).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
