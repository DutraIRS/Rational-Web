name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "fastapi==0.110.0" "pydantic==2.6.0" "uvicorn==0.27.0.post1" "pytest>=8" "pytest-asyncio>=0.23" "httpx>=0.27,<0.28"
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/test_compatibility.py tests/test_protocol.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --ignore=tests/browser --cov=rational --cov-branch --cov-report=term-missing --cov-fail-under=88

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,docs]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m sphinx -W -b html docs docs/_build/html

  browser:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    env:
      RATIONAL_BROWSER: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python -m pytest tests/browser

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Clean install smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import rational; print(rational.__version__)"

  javascript:
    # The browser runtime has no npm dependencies; ESLint runs from npx with a self-contained config.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for f in src/rational/static/*.js; do node --check "$f"; done
      - run: npx --yes eslint@10.12.0 --max-warnings 0 src/rational/static
