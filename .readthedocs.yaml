version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # The version comes from the git tag; Read the Docs clones shallow and without tags.
      - git fetch --unshallow --tags || git fetch --tags

python:
  install:
    - method: pip
      path: .
      extra_requirements: [docs]

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
