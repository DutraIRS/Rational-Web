[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "rational"
dynamic = ["version"]
description = "A Python-first, object-oriented web framework: server-rendered components, typed styles, explicit remote calls."
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Iago Riveiro Santos Dutra" }]
keywords = ["web", "framework", "fastapi", "ssr", "components", "reactive", "css-in-python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.27",
]

[project.urls]
Homepage = "https://github.com/DutraIRS/Rational-Web"
Documentation = "https://rational-web.readthedocs.io"
Repository = "https://github.com/DutraIRS/Rational-Web"
Issues = "https://github.com/DutraIRS/Rational-Web/issues"
Changelog = "https://github.com/DutraIRS/Rational-Web/blob/main/CHANGELOG.md"
Funding = "https://ko-fi.com/dutrairs"

[project.scripts]
rational = "rational.cli:main"

[project.optional-dependencies]
db = ["sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.19"]
redis = ["redis>=5"]
migrations = ["rational[db]", "alembic>=1.13"]
testing = ["httpx>=0.27,<0.28", "httpx2>=2"]  # Starlette <1 uses httpx; >=1 prefers httpx2
dev = [
    "rational[db,testing,migrations]",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
]
browser = ["playwright>=1.44"]
telemetry = ["opentelemetry-api>=1.25"]
docs = ["rational[db,testing]", "sphinx>=7", "furo>=2024.1", "sphinx-autobuild>=2024.2"]

[tool.hatch.version]
path = "src/rational/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rational"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rational",
    "tests",
    "examples",
    "benchmarks",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
    "CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["browser: drives a real browser (needs `pip install rational[browser]` + `playwright install chromium`)"]
filterwarnings = ["error::DeprecationWarning:rational.*"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N802"]  # primitives are capitalized functions on purpose (Text, Button, ...)

[tool.ruff.lint.isort]
known-first-party = ["rational"]
# Example and tutorial projects import their own layers by these names: keep them in a separate group.
known-local-folder = ["models", "services", "views", "settings", "content"]

[tool.ruff.lint.per-file-ignores]
"src/rational/errors.py" = ["N818"]  # HTTP-status names (NotFound, Forbidden) like Werkzeug/Starlette
"tests/*" = ["N806"]
"examples/*" = ["N806"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rational"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["redis", "redis.*"]
ignore_missing_imports = true  # optional dependency
